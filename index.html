<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes System Design</title>
    <link rel="stylesheet" href="style.css" />
    <script src="api.js" defer></script>
  </head>
  <body>
    <main class="container">
      <header>
        <h1>QuickNotes</h1>
        <p>Explore notes fetched from a REST API.</p>
      </header>

      <section aria-labelledby="notes-heading">
        <h2 id="notes-heading">Your Notes</h2>
        <button id="load-btn" type="button">Load Notes</button>
        <p id="status" role="status" aria-live="polite">
          Click "Load Notes" to fetch notes.
        </p>
        <ul id="notes-list"></ul>
      </section>

      <section aria-labelledby="create-heading">
        <h2 id="create-heading">Create a Note</h2>
        <form id="note-form">
          <label for="title-input">Title</label>
          <input
            id="title-input"
            name="title"
            type="text"
            maxlength="100"
            required
          />

          <label for="body-input">Note body (optional)</label>
          <textarea id="body-input" name="body" rows="4"></textarea>

          <button id="submit-btn" type="submit">Create Note</button>
        </form>
      </section>
    </main>
  </body>
</html>
